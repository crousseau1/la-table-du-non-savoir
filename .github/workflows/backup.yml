name: backup

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pull online data
        run: node scripts/backup.js
      - name: Commit
        run: |
          git config user.name "backup"
          git config user.email "backup@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Backup questions and plays"
          git push
